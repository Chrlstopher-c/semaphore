name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
jobs:
  noyaux:
    name: Tests des noyaux (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: swift test (noyaux purs, sans SwiftUI)
        run: swift test
